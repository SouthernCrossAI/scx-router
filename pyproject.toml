[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scx-router"
version = "0.1.0"
description = "Minimal Python component for the SCX Router v0.1 model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SouthernCrossAI" }]
dependencies = [
    "gliclass>=0.1.20,<0.2",
    "torch>=2.0",
    "transformers>=5,<6",
]

[project.urls]
Homepage = "https://github.com/SouthernCrossAI/scx-router"
Model = "https://huggingface.co/scx-admin/scx-router-v0.1"
Paper = "https://github.com/SouthernCrossAI/scx-router/blob/main/paper/SCX_Model_Router.pdf"

[project.scripts]
scx-router = "scx_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
